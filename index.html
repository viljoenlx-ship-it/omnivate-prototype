<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3B2F8F" />
  <title>Omnivate Solutions — Owner Control Panel</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/favicon-192.png" />
  <link rel="stylesheet" href="fonts/inter.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    try {
      if (localStorage.getItem("omnivate.theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <button type="button" id="theme-toggle" aria-label="Toggle dark mode">Dark</button>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/vendor/label-size.js"></script>
  <script src="js/vendor/JsBarcode.all.min.js"></script>
  <script src="js/vendor/niimbot.js"></script>
  <script src="js/print-queue.js"></script>
  <script src="js/app.js"></script>
  <script src="js/live.js"></script>
  <script src="js/shop.js"></script>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      function paint() {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        btn.textContent = dark ? "Light" : "Dark";
      }
      paint();
      btn.addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        if (dark) document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", "dark");
        try { localStorage.setItem("omnivate.theme", dark ? "light" : "dark"); } catch (e) {}
        paint();
      });
    })();
  </script>
</body>
</html>
